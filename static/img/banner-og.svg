<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a10"/>
      <stop offset="40%" stop-color="#0e381f"/>
      <stop offset="80%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="bannerDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.45" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <!-- Decorative Background Grid -->
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#goldGrad)"/>

  <!-- Glowing Aura behind Logo -->
  <circle cx="230" cy="315" r="260" fill="url(#goldGlow)"/>

  <!-- Standalone Large Logo Mark (Scaled at 220x220) -->
  <g transform="translate(110, 195) scale(1.9)" filter="url(#bannerDropShadow)">
    <!-- Squircle Base -->
    <rect x="5" y="5" width="110" height="110" rx="26" fill="#0c331c" stroke="url(#goldGrad)" stroke-width="4.5"/>

    <!-- Shopping Bag Handles -->
    <path d="M46 44 V31 C46 23.5 74 23.5 74 31 V44" 
          fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Shopping Bag Body -->
    <path d="M31 45 L35 94 C35.5 98.5 39 101 44 101 L76 101 C81 101 84.5 98.5 85 94 L89 45 Z" 
          fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>

    <!-- Graduation Cap Motif -->
    <path d="M60 48 L88 59 L60 70 L32 59 Z" fill="url(#goldGrad)"/>
    <path d="M44 64.5 V72 C44 76 51 79 60 79 C69 79 76 76 76 72 V64.5" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M76 65 L88 71 V83" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="88" cy="84" r="2.5" fill="#fde047"/>
    <path d="M48 89 L56 96 L72 83" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(390, 130)">
    <!-- Campus Badge -->
    <rect x="0" y="15" width="345" height="36" rx="18" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="172" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fde047" text-anchor="middle" letter-spacing="1">
      HARAMAYA UNIVERSITY • BATE MARKET
    </text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Campus <tspan fill="url(#goldGrad)">Gabaa</tspan>
    </text>

    <!-- HU Pill Badge next to title -->
    <g transform="translate(490, 68)">
      <rect width="74" height="46" rx="12" fill="url(#goldGrad)"/>
      <text x="37" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#061a10" text-anchor="middle">HU</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="500" fill="#e2e8f0">
      Campus Shopping &amp; Multi-Kiosk Price Comparison Platform
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 220)">
      <!-- Badge 1: Compare Dorms -->
      <g>
        <rect x="0" y="0" width="235" height="46" rx="10" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2"/>
        <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff">
          🏬 Dorm Kiosks (1-60)
        </text>
      </g>
      <!-- Badge 2: Freshness -->
      <g transform="translate(250, 0)">
        <rect x="0" y="0" width="240" height="46" rx="10" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2"/>
        <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff">
          ⚡ Live Freshness Badges
        </text>
      </g>
      <!-- Badge 3: Trilingual -->
      <g transform="translate(505, 0)">
        <rect x="0" y="0" width="245" height="46" rx="10" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2"/>
        <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff">
          🌐 Oromoo • አማርኛ • EN
        </text>
      </g>
    </g>

    <!-- Bottom Benefit Callout -->
    <g transform="translate(0, 295)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
        Never overpay or walk across campus for stationery, electronics, or dorm essentials.
      </text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="60" y1="575" x2="1140" y2="575" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <text x="60" y="602" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    Official Haramaya University Student Community Project • Zero Budget Monolith Architecture
  </text>
  <text x="1140" y="602" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="end">
    campus-gabaa.onrender.com
  </text>
</svg>