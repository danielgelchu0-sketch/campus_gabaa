<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70">
  <defs>
    <linearGradient id="cgGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0a371e"/>
    </linearGradient>
    <linearGradient id="cgGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="cgShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Embedded Logo Mark (left aligned at x=6, y=6, size 58x58) -->
  <g transform="translate(6, 6) scale(0.4833)">
    <!-- Squircle Base -->
    <rect x="5" y="5" width="110" height="110" rx="26" fill="url(#cgGreenGrad)" stroke="url(#cgGoldGrad)" stroke-width="4"/>

    <!-- Shopping Bag Handles -->
    <path d="M46 44 V31 C46 23.5 74 23.5 74 31 V44" 
          fill="none" stroke="url(#cgGoldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cgShadow)"/>

    <!-- Shopping Bag Body -->
    <path d="M31 45 L35 94 C35.5 98.5 39 101 44 101 L76 101 C81 101 84.5 98.5 85 94 L89 45 Z" 
          fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>

    <!-- Graduation Cap Motif -->
    <path d="M60 48 L88 59 L60 70 L32 59 Z" fill="url(#cgGoldGrad)" filter="url(#cgShadow)"/>
    <path d="M44 64.5 V72 C44 76 51 79 60 79 C69 79 76 76 76 72 V64.5" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M76 65 L88 71 V83" 
          fill="none" stroke="url(#cgGoldGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="88" cy="84" r="2.5" fill="#fde047"/>
    <path d="M48 89 L56 96 L72 83" 
          fill="none" stroke="url(#cgGoldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="76" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Campus <tspan fill="url(#cgGoldGrad)">Gabaa</tspan>
  </text>
  
  <!-- HU Badge -->
  <rect x="245" y="22" width="38" height="22" rx="6" fill="url(#cgGoldGrad)"/>
  <text x="264" y="37.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">HU</text>

  <!-- Sub-caption -->
  <text x="76" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" letter-spacing="0.3">
    HARAMAYA UNIVERSITY MARKETPLACE
  </text>
</svg>