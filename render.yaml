services:
  - type: web
    name: campus-gabaa
    env: python
    plan: free
    region: frankfurt # Low-latency for East Africa / Ethiopia
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /healthz/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PRICE_STALE_DAYS
        value: "7"
      # If using free PostgreSQL database, link connection string:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: campus-gabaa-db
      #     property: connectionString

# Optional free managed PostgreSQL on Render:
# databases:
#   - name: campus-gabaa-db
#     plan: free
#     region: frankfurt
